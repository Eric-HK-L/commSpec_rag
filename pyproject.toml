[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[project]
name = "commspec-rag"
version = "1.0.0"
description = "通信协议规范 RAG 融合项目 — 支持 3GPP + O-RAN 协议智能检索增强生成"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [
    {name = "Commspec RAG Project Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Eric-H-KL/commspec_rag_project"
Repository = "https://github.com/Eric-H-KL/commspec_rag_project"
Issues = "https://github.com/Eric-H-KL/commspec_rag_project/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["-v", "--tb=short", "--strict-markers", "--ignore=tests/e2e/"]
markers = [
    "milvus: tests requiring Milvus connection",
    "e2e: end-to-end tests requiring full stack",
    "slow: tests that take >1s",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
