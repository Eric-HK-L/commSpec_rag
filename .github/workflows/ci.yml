name: Python CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests (no Milvus required)
        run: |
          python -m pytest tests/test_generator/ tests/test_retriever/ \
            -v --tb=short \
            --ignore=tests/test_ingestion/ \
            -k "not milvus and not e2e" || true

      - name: Check import integrity
        run: |
          python -c "
from src.generator.prompt import build_rag_prompt
from src.generator.i18n import detect_language
from src.retriever.cross_ref import extract_references
from src.config.settings import Settings
print('All core imports OK')
"

      - name: Validate eval test set (dry-run)
        run: |
          python -m tests.eval.run_eval --dry-run || echo "⚠️ 测试集不存在, 跳过"
